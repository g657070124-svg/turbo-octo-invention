name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 5 \( -name "settings.gradle.kts" -o -name "build.gradle.kts" \) -print

      - name: Build APK
        run: |
          cd "$GITHUB_WORKSPACE"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qiyasat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
